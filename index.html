 background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:5px 5px;border:4px double var(--gold)}

.about p{text-align:center;font:400 20px Amiri;margin:6px 0}
#tl{position:fixed;left:50%;bottom:20px;transform:translate(-50%,170%);width:min(760px,94vw);background:var(--paper);border:4px double var(--gold);border-radius:6px;padding:12px 20px 18px;z-index:6;transition:transform .35s;box-shadow:0 10px 30px #0008}
#tl.open{transform:translate(-50%,0)}
#tl h2{margin:0 0 8px;font:700 30px Amiri;text-align:center;color:var(--ink)}
.ms{display:flex;gap:10px;align-items:center;direction:ltr}
.ms .c{width:58px;height:58px;border-radius:50%;border:2px solid #8a7a5a;flex:none;transition:background .3s}
.ms .c.on{background:#C9BBA0}
.ms .b{flex:1;height:44px;background:#CFC2A6;border-radius:3px;display:grid;place-items:center;font-size:13px;color:#6a5d48}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#3A1E22;color:var(--paper);z-index:9;font:700 26px Amiri;transition:opacity .6s}
@media(max-width:767px){.card{top:auto;bottom:0;right:0;left:0;width:auto;height:70vh;max-height:70vh;transform:translateY(110%)}.card.open{transform:translateY(0)}#nav button{padding:5px 10px;font-size:14px}.ms .c{width:36px;height:36px}}
